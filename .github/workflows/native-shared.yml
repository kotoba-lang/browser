name: Native shared text-edit
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-dom-host:
    name: Offline DOM host (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate detached DOM transactions
        run: python3 scripts/check-local-dom-host.py --browser "$(command -v google-chrome)" --output "$RUNNER_TEMP/local-dom-host"
      - name: Validate isolated page transactions
        run: python3 scripts/check-local-page-host.py --browser "$(command -v google-chrome)" --output "$RUNNER_TEMP/local-page-host"
      - name: Validate synthetic HTML responses
        run: python3 scripts/check-local-html-response.py --browser "$(command -v google-chrome)" --output "$RUNNER_TEMP/html-response"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/wasm-webcomponent
          ref: e00ae75e1c589f76b4f53a88a5e3256c98c9e162
          path: _broker
          persist-credentials: false
      - name: Verify canonical broker and response boundary offline
        run: >-
          python3 scripts/check-local-broker-response.py --browser "$(command -v google-chrome)"
          --broker "$PWD/_broker/src/kotoba-client-runtime.js" --output "$RUNNER_TEMP/broker-response"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: offline-dom-host
          path: |
            ${{ runner.temp }}/local-dom-host/*.json
            ${{ runner.temp }}/local-dom-host/*.html
            ${{ runner.temp }}/local-dom-host/*.stderr
            ${{ runner.temp }}/local-dom-host/event-wire.txt
            ${{ runner.temp }}/local-page-host/*.json
            ${{ runner.temp }}/local-page-host/*.html
            ${{ runner.temp }}/local-page-host/*.stderr
            ${{ runner.temp }}/html-response/*.json
            ${{ runner.temp }}/broker-response/*.json
          if-no-files-found: warn
  native-html-page-wire:
    name: Build native HTML page wire
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: 68678c1bb0b08fd3ad1d920e4f63422fc12ade68
          path: _html
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: d4d6841f129d846db13393a469645e1ca91fb568
          path: _amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: 071a7a524f9c416815937fed0a3443285c2ff7e0
          path: _dom
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: b7719f723fbf94f11e19dcda12641f682e324e62
          path: _text
          persist-credentials: false
      - name: Build and run locked HTML fixture
        run: >-
          python3 _html/scripts/check-html-native.py --case html_fragment_wire
          --compiler "$PWD/_amu/seed/bootstrap/aarch64-linux-static-root.elf"
          --compiler-sha256 73350746c1f86dcfbe8cf47723bd7bb1e33ee28f0e08e40bef2dd2b196f5a09b
          --runner-source "$PWD/_amu/seed/x86_64-kx64-runner.kotoba"
          --dom "$PWD/_dom/lib/kotoba.domGpu" --output "$RUNNER_TEMP/html-page"
      - name: Build Browser navigation and page wire
        run: >-
          python3 scripts/check-shared-native.py --case local-html-navigation
          --compiler "$PWD/_amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64
          --runner-source "$PWD/_amu/seed/x86_64-kx64-runner.kotoba"
          --browser "$PWD" --dom "$PWD/_dom/lib/kotoba.domGpu"
          --text "$PWD/_text/lib/kotoba.text" --html "$PWD/_html/lib/kotoba.htmldom"
          --output "$RUNNER_TEMP/nav-page"
      - name: Prepare shell frame and HTML page
        run: >-
          python3 scripts/check-shared-native.py --case local-html-loop
          --compiler "$PWD/_amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64
          --runner-source "$PWD/_amu/seed/x86_64-kx64-runner.kotoba"
          --browser "$PWD" --dom "$PWD/_dom/lib/kotoba.domGpu"
          --text "$PWD/_text/lib/kotoba.text" --html "$PWD/_html/lib/kotoba.htmldom"
          --output "$RUNNER_TEMP/loop-page"
      - name: Build native page-bearing actor frame
        run: >-
          python3 scripts/check-shared-native.py --case local-html-frame
          --compiler "$PWD/_amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64
          --runner-source "$PWD/_amu/seed/x86_64-kx64-runner.kotoba"
          --browser "$PWD" --dom "$PWD/_dom/lib/kotoba.domGpu"
          --text "$PWD/_text/lib/kotoba.text" --html "$PWD/_html/lib/kotoba.htmldom"
          --output "$RUNNER_TEMP/frame-page"
      - name: Exercise local HTML actor transport
        run: >-
          python3 scripts/check-shared-native.py --case local-html-actor
          --compiler "$PWD/_amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64
          --runner-source "$PWD/_amu/seed/x86_64-kx64-runner.kotoba"
          --browser "$PWD" --dom "$PWD/_dom/lib/kotoba.domGpu"
          --text "$PWD/_text/lib/kotoba.text" --html "$PWD/_html/lib/kotoba.htmldom"
          --output "$RUNNER_TEMP/html-actor"
      - name: Compare independent wire output
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          assert json.loads((temp / 'html-page/semantic-wire.json').read_text()) == json.loads((temp / 'nav-page/wire.json').read_text()) == json.loads((temp / 'loop-page/wire.json').read_text())
          frame = (temp / 'frame-page/pageframe.bin').read_bytes()
          header, payload = frame.split(b'\n', 1)
          marker, revision, shell_size, page_size = header.split()
          assert marker == b'PFRAME' and revision == b'1' and len(payload) == int(shell_size) + int(page_size)
          assert json.loads(payload[int(shell_size):]) == json.loads((temp / 'loop-page/wire.json').read_text())
          (temp / 'loop-page/pageframe.bin').write_bytes(frame)
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-html-page-wire
          path: |
            ${{ runner.temp }}/loop-page/wire.json
            ${{ runner.temp }}/loop-page/pageframe.bin
            ${{ runner.temp }}/loop-page/shared-native.json
            ${{ runner.temp }}/loop-page/local-html-loop.ksl
          if-no-files-found: error
  native-html-page-host:
    name: Native HTML wire to Chrome page
    needs: native-html-page-wire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-html-page-wire
          path: ${{ runner.temp }}/html-page
      - name: Apply freshly generated HTML page
        run: >-
          python3 scripts/check-local-page-host.py --browser "$(command -v google-chrome)"
          --wire "$RUNNER_TEMP/html-page/wire.json" --frame "$RUNNER_TEMP/html-page/pageframe.bin" --output "$RUNNER_TEMP/native-page-host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-html-page-host
          path: |
            ${{ runner.temp }}/native-page-host/*.json
            ${{ runner.temp }}/native-page-host/*.html
          if-no-files-found: warn
  chrome-event-native:
    name: Chrome event to native state
    needs: offline-dom-host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 6a77cd91182b858fff435c679e8ef71f514fc2ae
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: 071a7a524f9c416815937fed0a3443285c2ff7e0
          path: _shared/domowner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: b7719f723fbf94f11e19dcda12641f682e324e62
          path: _shared/kotoba
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: offline-dom-host
          path: ${{ runner.temp }}/chrome-event
      - name: Verify compiler identity
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_native/amu/seed/bootstrap')
          assert hashlib.sha256((root / 'aarch64-linux-static-root.elf').read_bytes()).hexdigest() == json.loads((root / 'aarch64-linux-static-root.json').read_text())['image']['sha256']
          PY
      - name: Apply Chrome event in native Kotoba
        run: python3 scripts/check-shared-native.py --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-loop-input --event-wire "$RUNNER_TEMP/chrome-event/event-wire.txt" --output "$RUNNER_TEMP/chrome-event-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chrome-event-native
          path: |
            ${{ runner.temp }}/chrome-event-native/*.json
            ${{ runner.temp }}/chrome-event-native/*.ksl
            ${{ runner.temp }}/chrome-event-native/*.stdout
            ${{ runner.temp }}/chrome-event-native/*.stderr
          if-no-files-found: warn
  native-wire-chrome:
    name: Native DOM wire to Chrome
    needs: native-shared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-dom-wire-arm64
          path: ${{ runner.temp }}/native-dom-wire
      - name: Render native output in Chrome
        run: python3 scripts/check-local-dom-host.py --browser "$(command -v google-chrome)" --wire "$RUNNER_TEMP/native-dom-wire/wire.json" --output "$RUNNER_TEMP/native-wire-chrome"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-wire-chrome
          path: |
            ${{ runner.temp }}/native-wire-chrome/*.json
            ${{ runner.temp }}/native-wire-chrome/*.html
            ${{ runner.temp }}/native-wire-chrome/*.stderr
          if-no-files-found: warn
  chrome-native-roundtrip:
    name: Chrome event native redraw
    needs: chrome-event-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: chrome-event-native
          path: ${{ runner.temp }}/native-loop-result
      - name: Render native event result
        run: python3 scripts/check-local-dom-host.py --browser "$(command -v google-chrome)" --wire "$RUNNER_TEMP/native-loop-result/wire.json" --wire-case roundtrip --output "$RUNNER_TEMP/chrome-native-roundtrip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chrome-native-roundtrip
          path: |
            ${{ runner.temp }}/chrome-native-roundtrip/*.json
            ${{ runner.temp }}/chrome-native-roundtrip/*.html
            ${{ runner.temp }}/chrome-native-roundtrip/*.stderr
          if-no-files-found: warn
  native-shared:
    name: Native text-edit (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: arm64
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 6a77cd91182b858fff435c679e8ef71f514fc2ae
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Draft dependency: kotoba PR #1173, not yet merged.
          repository: kotoba-lang/kotoba
          ref: 071a7a524f9c416815937fed0a3443285c2ff7e0
          path: _shared/domowner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: b7719f723fbf94f11e19dcda12641f682e324e62
          path: _shared/kotoba
          persist-credentials: false
      - name: Verify the exact native compiler image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('_native/amu')
          arm = os.environ['TARGET'] == 'arm64'
          image = root / ('seed/bootstrap/aarch64-linux-static-root.elf' if arm else 'bin/amu')
          meta = json.loads((root / ('seed/bootstrap/aarch64-linux-static-root.json' if arm else 'native-product.json')).read_text())
          assert hashlib.sha256(image.read_bytes()).hexdigest() == meta['image']['sha256']
          PY
      - name: Execute native x86 project and refusal controls
        if: matrix.target == 'x86_64'
        run: python3 _native/amu/scripts/seed/check-x86-project-native.py --compiler "$PWD/_native/amu/bin/amu" --output "$RUNNER_TEMP/project-native"
      - name: Execute current owner source on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case text-edit --output "$RUNNER_TEMP/owner-native"
      - name: Execute current owner source on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case text-edit --output "$RUNNER_TEMP/owner-native"
      - name: Execute shared tab model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case chrome --output "$RUNNER_TEMP/chrome-native"
      - name: Execute shared tab model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case chrome --output "$RUNNER_TEMP/chrome-native"
      - name: Execute shared origin model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case origin --output "$RUNNER_TEMP/origin-native"
      - name: Execute shared origin model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case origin --output "$RUNNER_TEMP/origin-native"
      - name: Execute shared storage model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case storage --output "$RUNNER_TEMP/storage-native"
      - name: Execute shared storage model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case storage --output "$RUNNER_TEMP/storage-native"
      - name: Execute local session on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-session --output "$RUNNER_TEMP/session-native"
      - name: Execute local session on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-session --output "$RUNNER_TEMP/session-native"
      - name: Execute local view on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-view --output "$RUNNER_TEMP/view-native"
      - name: Execute local view on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-view --output "$RUNNER_TEMP/view-native"
      - name: Execute local text page on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-text-view --output "$RUNNER_TEMP/text-view-native"
      - name: Execute local text page on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-text-view --output "$RUNNER_TEMP/text-view-native"
      - name: Execute multi-tab text page on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-multitab-text --output "$RUNNER_TEMP/multitab-text-native"
      - name: Execute multi-tab text page on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-multitab-text --output "$RUNNER_TEMP/multitab-text-native"
      - name: Execute multi-tab DOM replay on ARM
        if: matrix.target == 'arm64'
