name: Native shared text-edit
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-shared:
    name: Native text-edit (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: arm64
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 6a77cd91182b858fff435c679e8ef71f514fc2ae
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Draft dependency: kotoba PR #1173, not yet merged.
          repository: kotoba-lang/kotoba
          ref: fad5749cfb69b2ffb4f15dfa5bfc372c220b1eb7
          path: _shared/domowner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: b7719f723fbf94f11e19dcda12641f682e324e62
          path: _shared/kotoba
          persist-credentials: false
      - name: Verify the exact native compiler image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('_native/amu')
          arm = os.environ['TARGET'] == 'arm64'
          image = root / ('seed/bootstrap/aarch64-linux-static-root.elf' if arm else 'bin/amu')
          meta = json.loads((root / ('seed/bootstrap/aarch64-linux-static-root.json' if arm else 'native-product.json')).read_text())
          assert hashlib.sha256(image.read_bytes()).hexdigest() == meta['image']['sha256']
          PY
      - name: Execute native x86 project and refusal controls
        if: matrix.target == 'x86_64'
        run: python3 _native/amu/scripts/seed/check-x86-project-native.py --compiler "$PWD/_native/amu/bin/amu" --output "$RUNNER_TEMP/project-native"
      - name: Execute current owner source on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case text-edit --output "$RUNNER_TEMP/owner-native"
      - name: Execute current owner source on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case text-edit --output "$RUNNER_TEMP/owner-native"
      - name: Execute shared tab model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case chrome --output "$RUNNER_TEMP/chrome-native"
      - name: Execute shared tab model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case chrome --output "$RUNNER_TEMP/chrome-native"
      - name: Execute shared origin model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case origin --output "$RUNNER_TEMP/origin-native"
      - name: Execute shared origin model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case origin --output "$RUNNER_TEMP/origin-native"
      - name: Execute shared storage model on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case storage --output "$RUNNER_TEMP/storage-native"
      - name: Execute shared storage model on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case storage --output "$RUNNER_TEMP/storage-native"
      - name: Execute local session on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-session --output "$RUNNER_TEMP/session-native"
      - name: Execute local session on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-session --output "$RUNNER_TEMP/session-native"
      - name: Execute local view on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-view --output "$RUNNER_TEMP/view-native"
      - name: Execute local view on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-view --output "$RUNNER_TEMP/view-native"
      - name: Execute local text page on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-text-view --output "$RUNNER_TEMP/text-view-native"
      - name: Execute local text page on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-text-view --output "$RUNNER_TEMP/text-view-native"
      - name: Execute multi-tab text page on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-multitab-text --output "$RUNNER_TEMP/multitab-text-native"
      - name: Execute multi-tab text page on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-multitab-text --output "$RUNNER_TEMP/multitab-text-native"
      - name: Execute multi-tab DOM replay on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-replay --output "$RUNNER_TEMP/dom-replay-native"
      - name: Execute multi-tab DOM replay on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-replay --output "$RUNNER_TEMP/dom-replay-native"
      - name: Execute DOM commit admission on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-commit --output "$RUNNER_TEMP/dom-commit-native"
      - name: Execute DOM commit admission on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-commit --output "$RUNNER_TEMP/dom-commit-native"
      - name: Execute local controller on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-controller --output "$RUNNER_TEMP/controller-native"
      - name: Execute local controller on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-controller --output "$RUNNER_TEMP/controller-native"
      - name: Execute local DOM events on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-events --output "$RUNNER_TEMP/dom-events-native"
      - name: Execute local DOM events on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD" --dom "$PWD/_shared/domowner/lib/kotoba.domGpu" --text "$PWD/_shared/kotoba/lib/kotoba.text" --case local-dom-events --output "$RUNNER_TEMP/dom-events-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/owner-native/*.json
            ${{ runner.temp }}/owner-native/*.ksl
            ${{ runner.temp }}/owner-native/*.stdout
            ${{ runner.temp }}/owner-native/*.stderr
            ${{ runner.temp }}/chrome-native/*.json
            ${{ runner.temp }}/chrome-native/*.ksl
            ${{ runner.temp }}/chrome-native/*.stdout
            ${{ runner.temp }}/chrome-native/*.stderr
            ${{ runner.temp }}/origin-native/*.json
            ${{ runner.temp }}/origin-native/*.ksl
            ${{ runner.temp }}/origin-native/*.stdout
            ${{ runner.temp }}/origin-native/*.stderr
            ${{ runner.temp }}/storage-native/*.json
            ${{ runner.temp }}/storage-native/*.ksl
            ${{ runner.temp }}/storage-native/*.stdout
            ${{ runner.temp }}/storage-native/*.stderr
            ${{ runner.temp }}/session-native/*.json
            ${{ runner.temp }}/session-native/*.ksl
            ${{ runner.temp }}/session-native/*.stdout
            ${{ runner.temp }}/session-native/*.stderr
            ${{ runner.temp }}/view-native/*.json
            ${{ runner.temp }}/view-native/*.ksl
            ${{ runner.temp }}/view-native/*.stdout
            ${{ runner.temp }}/view-native/*.stderr
            ${{ runner.temp }}/text-view-native/*.json
            ${{ runner.temp }}/text-view-native/*.ksl
            ${{ runner.temp }}/text-view-native/*.stdout
            ${{ runner.temp }}/text-view-native/*.stderr
            ${{ runner.temp }}/multitab-text-native/*.json
            ${{ runner.temp }}/multitab-text-native/*.ksl
            ${{ runner.temp }}/multitab-text-native/*.stdout
            ${{ runner.temp }}/multitab-text-native/*.stderr
            ${{ runner.temp }}/dom-replay-native/*.json
            ${{ runner.temp }}/dom-replay-native/*.ksl
            ${{ runner.temp }}/dom-replay-native/*.stdout
            ${{ runner.temp }}/dom-replay-native/*.stderr
            ${{ runner.temp }}/dom-commit-native/*.json
            ${{ runner.temp }}/dom-commit-native/*.ksl
            ${{ runner.temp }}/dom-commit-native/*.stdout
            ${{ runner.temp }}/dom-commit-native/*.stderr
            ${{ runner.temp }}/controller-native/*.json
            ${{ runner.temp }}/controller-native/*.ksl
            ${{ runner.temp }}/controller-native/*.stdout
            ${{ runner.temp }}/controller-native/*.stderr
            ${{ runner.temp }}/dom-events-native/*.json
            ${{ runner.temp }}/dom-events-native/*.ksl
            ${{ runner.temp }}/dom-events-native/*.stdout
            ${{ runner.temp }}/dom-events-native/*.stderr
            ${{ runner.temp }}/project-native/*.json
            ${{ runner.temp }}/project-native/*.stdout
            ${{ runner.temp }}/project-native/*.stderr
          if-no-files-found: warn
